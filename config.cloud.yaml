# $PRJ/config.cloud.yaml — GitHub Actions 雲端版（F-010）
# 除 paths / network_check / apple_calendar 外，其餘必須與 config.yaml 相同（tests/test_cloud_config.py 檢查）。
# 修改觀察清單等設定時，兩個檔案要一起改。
timezone: Asia/Taipei

paths:                        # 相對路徑以程式根目錄為根
  output_dir: site            # 直接輸出到 Pages 目錄；失敗的行事曆保留從 state 分支還原的上一版
  data_dir: cloud-data        # calendar.db 由 state 分支還原與保存
  logs_dir: cloud-logs        # 以 Actions artifact 保存 14 天

range:
  months_before: 3
  months_after: 12
  align_to_month: true        # D-3

reminder:
  days_before: 1
  time: "20:00"               # Asia/Taipei

calendars:
  tw-settlement: {filename: tw-settlement.ics, name: 台股結算}
  us-settlement: {filename: us-settlement.ics, name: 美股結算}
  tw-earnings:   {filename: tw-earnings.ics,   name: 台股法說與財報}
  us-earnings:   {filename: us-earnings.ics,   name: 美股財報（AI 供應鏈）}
  global-holidays: {filename: global-holidays.ics, name: 海外休市（美日韓）}

tw_settlement:
  weekly_wed: {enabled: true, holiday_policy: next}   # next|previous|skip（開發階段核對期交所規格）
  weekly_fri: {enabled: true, holiday_policy: next}

# 期交所休市日表（kind: holiday=國定假日；market_only=市場無交易但機關上班）
# 2026：開發階段逐筆對照期交所公告；2027：依法定假日推算暫定值，公告後更新
taifex_holidays:
  - {date: 2026-01-01, name: 元旦}
  - {date: 2026-02-12, name: 春節前結算交割日（無交易）, kind: market_only}
  - {date: 2026-02-13, name: 春節前結算交割日（無交易）, kind: market_only}
  - {date: 2026-02-16, name: 春節}
  - {date: 2026-02-17, name: 春節}
  - {date: 2026-02-18, name: 春節}
  - {date: 2026-02-19, name: 春節}
  - {date: 2026-02-20, name: 春節}
  - {date: 2026-02-27, name: 和平紀念日補假}
  - {date: 2026-04-03, name: 兒童節補假}
  - {date: 2026-04-06, name: 清明節補假}
  - {date: 2026-05-01, name: 勞動節}
  - {date: 2026-06-19, name: 端午節}
  - {date: 2026-09-25, name: 中秋節}
  - {date: 2026-09-28, name: 教師節}
  - {date: 2026-10-09, name: 國慶日補假}
  - {date: 2026-10-26, name: 臺灣光復紀念日補假}
  - {date: 2026-12-25, name: 行憲紀念日}
  - {date: 2027-01-01, name: 元旦, provisional: true}
  - {date: 2027-02-04, name: 春節, provisional: true}
  - {date: 2027-02-05, name: 春節, provisional: true}
  - {date: 2027-02-08, name: 春節, provisional: true}
  - {date: 2027-02-09, name: 春節補假, provisional: true}
  - {date: 2027-02-10, name: 春節補假, provisional: true}
  - {date: 2027-03-01, name: 和平紀念日補假, provisional: true}
  - {date: 2027-04-05, name: 清明節, provisional: true}
  - {date: 2027-04-06, name: 兒童節補假, provisional: true}
  - {date: 2027-04-30, name: 勞動節補假, provisional: true}
  - {date: 2027-06-09, name: 端午節, provisional: true}
  - {date: 2027-09-15, name: 中秋節, provisional: true}
  - {date: 2027-09-28, name: 教師節, provisional: true}
  - {date: 2027-10-11, name: 國慶日補假, provisional: true}
  - {date: 2027-10-25, name: 臺灣光復紀念日, provisional: true}
  - {date: 2027-12-24, name: 行憲紀念日補假, provisional: true}
  # 2027 春節前「僅結算交割無交易」日待期交所公告後補入（kind: market_only）

taifex_extra_holidays: []     # 使用者補充（颱風假等），格式同上

tw_filing:
  q1: "05-15"
  q2: "08-14"
  q3: "11-14"
  annual: "03-31"             # 次年
  monthly_revenue_day: 10

mops:
  url: https://mopsov.twse.com.tw/mops/web/ajax_t100sb02_1
  referer: https://mopsov.twse.com.tw/mops/web/t100sb02_1
  markets: [sii, otc]
  request_interval_sec: 2.5   # ≥2
  timeout_sec: 15
  max_retries: 2
  backoff_sec: 3
  reconcile_future: true      # D-6
  total_budget_sec: 35        # v2：MOPS 階段時間上限
user_agent: "Mozilla/5.0 (Macintosh; Intel Mac OS X 14_0) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"

yahoo:
  enabled: true
  url: https://tw.stock.yahoo.com/calendar/earnings-call
  timeout_sec: 10
  max_retries: 1

tw_ir:
  default_duration_minutes: 60

us_earnings:
  # 每檔 {ticker, group}；修改後下次執行即生效；ticker 不可重複
