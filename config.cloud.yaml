    - {ticker: AVGO, group: ASIC/網通晶片}
    - {ticker: MRVL, group: ASIC/網通晶片}
    # 雲端CSP
    - {ticker: MSFT,  group: 雲端CSP}
    - {ticker: GOOGL, group: 雲端CSP}
    - {ticker: AMZN,  group: 雲端CSP}
    - {ticker: META,  group: 雲端CSP}
    - {ticker: ORCL,  group: 雲端CSP}
    # Neocloud
    - {ticker: CRWV, group: Neocloud}
    - {ticker: NBIS, group: Neocloud}
    - {ticker: IREN, group: Neocloud}
    - {ticker: APLD, group: Neocloud}
    # 伺服器/EMS
    - {ticker: DELL, group: 伺服器/EMS}
    - {ticker: SMCI, group: 伺服器/EMS}
    - {ticker: HPE,  group: 伺服器/EMS}
    - {ticker: CLS,  group: 伺服器/EMS}
    - {ticker: JBL,  group: 伺服器/EMS}
    - {ticker: FLEX, group: 伺服器/EMS}
    # 網通交換器
    - {ticker: ANET, group: 網通交換器}
    - {ticker: CSCO, group: 網通交換器}
    # 光通訊
    - {ticker: LITE, group: 光通訊}
    - {ticker: COHR, group: 光通訊}
    - {ticker: CIEN, group: 光通訊}
    - {ticker: FN,   group: 光通訊}
    - {ticker: AAOI, group: 光通訊}
    # 高速連接
    - {ticker: CRDO, group: 高速連接}
    - {ticker: ALAB, group: 高速連接}
    # 電源散熱
    - {ticker: VRT,  group: 電源散熱}
    - {ticker: ETN,  group: 電源散熱}
    - {ticker: NVT,  group: 電源散熱}
    - {ticker: MOD,  group: 電源散熱}
    - {ticker: MPWR, group: 電源散熱}
    # 記憶體/儲存
    - {ticker: MU,   group: 記憶體/儲存}
    - {ticker: WDC,  group: 記憶體/儲存}
    - {ticker: STX,  group: 記憶體/儲存}
    - {ticker: SNDK, group: 記憶體/儲存}
    # 半導體設備/封測
    - {ticker: ASML, group: 半導體設備/封測}
    - {ticker: AMAT, group: 半導體設備/封測}
    - {ticker: LRCX, group: 半導體設備/封測}
    - {ticker: KLAC, group: 半導體設備/封測}
    - {ticker: TER,  group: 半導體設備/封測}
    - {ticker: AMKR, group: 半導體設備/封測}
    # 晶圓代工
    - {ticker: TSM, group: 晶圓代工}
    # 手機/邊緣AI
    - {ticker: AAPL, group: 手機/邊緣AI}
    - {ticker: QCOM, group: 手機/邊緣AI}
    - {ticker: ARM,  group: 手機/邊緣AI}
    # 其他
    - {ticker: INTC, group: 其他}
    # AI基建（電網/工程/電力/機房）
    - {ticker: GEV,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: PWR,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: EME,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: FIX,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: VST,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: CEG,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: BE,   group: AI基建（電網/工程/電力/機房）}
    - {ticker: DLR,  group: AI基建（電網/工程/電力/機房）}
    - {ticker: EQIX, group: AI基建（電網/工程/電力/機房）}
  max_workers: 6              # 有限並行（ThreadPool），上限 8
  submit_stagger_sec: 0.2     # 送出任務的間隔，避免同時打出去被 Yahoo 擋（HTTP 429）
  per_ticker_timeout_sec: 20  # 單檔逾時
  total_budget_sec: 40        # 整個美股財報抓取階段的時間上限（v4.1 R12）
  earnings_dates_limit: 12
  reconcile_future: true      # D-6

schedule:
  label: com.market-calendar-ics.daily
  times: ["08:30", "12:30", "19:30", "21:30"]   # 每日執行時間（1–12 個，HH:MM，不可重複）
  hour: 21                    # 相容欄位：times 優先，有 times 時忽略
  minute: 0                   # 相容欄位：times 優先，有 times 時忽略
  launch_mode: direct         # direct|open（v4.1 R16）

network_check:                # 雲端一定有網路；啟用的話，MOPS 和 Yahoo 同時擋海外 IP 時整次會被跳過
  enabled: false
  timeout_sec: 4

apple_calendar:               # F-008
  enabled: false              # 雲端無 EventKit；false → 完全不載入
  prefer_source: iCloud       # iCloud | local（local = 本機「On My Mac」）
  delete_future_missing: true # 今天以後、已不在本次集合的本專案事件 → 刪除

log:
  level: INFO
  retention_days: 30
