# 每日 4 次產生 5 個 .ics 並發布到 GitHub Pages（F-010）。
# 只使用內建 GITHUB_TOKEN，不需要也不要設定任何 Secrets。
# cron 一律是 UTC。台北時間 = UTC+8（無夏令時間）：
#   08:30 台北 = 00:30 UTC、12:30 = 04:30、19:30 = 11:30、21:30 = 13:30
# GitHub 排程可能延遲數分鐘到數十分鐘，屬正常現象。
# 權限分工：build 只讀（匿名 clone 還原 state）；save-state 才有寫入權，且只用官方 action。
# 注意：run 區塊內不使用 ${{ }}；需要的值一律經由 env 傳入。
name: publish-calendars

on:
  schedule:
    - cron: "30 0 * * *"    # 台北 08:30
    - cron: "30 4 * * *"    # 台北 12:30
    - cron: "30 11 * * *"   # 台北 19:30
    - cron: "30 13 * * *"   # 台北 21:30
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-calendars
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  STATE_BRANCH: state

jobs:
  build:
    name: 產生行事曆
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: 取得程式碼
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: 安裝 uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6.8.0
        with:
          version: "0.11.14"
          enable-cache: true
          cache-dependency-glob: requirements.txt

      - name: 建立 Python 3.11 環境並安裝套件
        timeout-minutes: 8
        run: |
          uv venv --python 3.11 .venv
          uv pip install --python .venv/bin/python -r requirements.txt

      - name: 還原上次狀態（state 分支，匿名 clone）
        id: restore
        timeout-minutes: 3
        run: |
          STATE_REMOTE="${MCI_STATE_REMOTE:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git}"
          rm -rf state-in prev-site
          set +e
          git ls-remote --exit-code --heads "$STATE_REMOTE" "$STATE_BRANCH" > /dev/null
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            git clone --quiet --depth 1 --branch "$STATE_BRANCH" --single-branch "$STATE_REMOTE" state-in
          elif [ "$rc" -eq 2 ]; then
            echo "::notice::尚無 $STATE_BRANCH 分支（第一次執行），從空白狀態開始"
            mkdir -p state-in
          else
            echo "::error::無法讀取 $STATE_BRANCH 分支（git ls-remote 結束碼 $rc）；若 repo 為 private 請改為 public。為避免覆蓋累積資料，本次停止"
            exit 1
          fi
          .venv/bin/python -m cloud.state restore --config config.cloud.yaml --state-dir state-in --prev-dir prev-site --info-out restore-info.json

      - name: 產生 5 個 .ics
        id: run
        timeout-minutes: 10
        run: |
          set +e
          .venv/bin/python main.py --config config.cloud.yaml --report run-report.json
          code=$?
          set -e
          echo "code=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 0 ]; then
            echo "全部成功"
          elif [ "$code" -eq 1 ]; then
            echo "::warning::部分行事曆或資料來源失敗；失敗的行事曆沿用上一版，詳見網站首頁與 status.json"
          else
            echo "::error::main.py 結束碼 $code（設定錯誤或程式異常），本次不發布、不保存狀態"
            exit "$code"
          fi

      - name: 產生 status.json 與 index.html（失敗者沿用上一版）
        id: publish
        timeout-minutes: 2
        env:
          RUN_EXIT_CODE: ${{ steps.run.outputs.code }}
          MCI_SITE_URL: ${{ vars.MCI_SITE_URL }}
        run: |
          SITE_URL="${MCI_SITE_URL:-https://$GITHUB_REPOSITORY_OWNER.github.io/${GITHUB_REPOSITORY#*/}/}"
          .venv/bin/python -m cloud.publish --config config.cloud.yaml --report run-report.json --prev-dir prev-site --restore-info restore-info.json --site-url "$SITE_URL" --exit-code "$RUN_EXIT_CODE"

      - name: 產生狀態 payload
        timeout-minutes: 3
        run: |
          rm -rf state-payload
          .venv/bin/python -m cloud.state save --config config.cloud.yaml --state-dir state-payload

      - name: 上傳 Pages 內容
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: 上傳狀態 payload（1 天）
        uses: actions/upload-artifact@v4
        with:
          name: state-payload
          path: state-payload/
          retention-days: 1
          include-hidden-files: false
          if-no-files-found: error

      - name: 保存執行日誌（14 天）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run-logs-${{ github.run_id }}
          path: |
            cloud-logs/
            run-report.json
            restore-info.json
          retention-days: 14
          if-no-files-found: ignore

  save-state:
    name: 保存狀態到 state 分支
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 下載狀態 payload
        uses: actions/download-artifact@v4
        with:
          name: state-payload
          path: state-out

      - name: 推送到 state 分支
        timeout-minutes: 3
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          STATE_REMOTE="${MCI_STATE_REMOTE:-$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git}"
          cd state-out
          git init --quiet --initial-branch="$STATE_BRANCH"
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              -c commit.gpgsign=false \
              commit --quiet -m "state: run ${GITHUB_RUN_ID:-local}"
          AUTH="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" \
            push --force --quiet "$STATE_REMOTE" "HEAD:refs/heads/$STATE_BRANCH"

  deploy:
    name: 發布到 GitHub Pages
    needs: [build, save-state]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署
        id: deployment
        uses: actions/deploy-pages@v5
